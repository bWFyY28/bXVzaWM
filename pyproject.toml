[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bxvzm"
version = "0.4.1"
description = "A local music library and terminal player"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "textual==8.1.1",
    "httpx==0.28.1",
    "mutagen==1.47.0",
    "pywin32==311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[project.scripts]
bxvzm = "bxvzm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bxvzm = ["themes/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
